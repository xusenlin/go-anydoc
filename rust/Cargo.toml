[package]
name = "anydoc-wasi"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
publish = false
description = "Thin wasm32-wasip1 command wrapper around the anydoc crate, for go-anydoc."

[dependencies]
# Pinned on purpose. Bumping this is an explicit, reviewed action:
# it changes conversion output for every downstream Go user.
anydoc = "=0.1.7"

[[bin]]
name = "anydoc-wasi"
path = "src/main.rs"

[profile.release]
# Speed over size. The tempting reasoning -- that the interpreter's dispatch
# overhead swamps whatever the optimiser does, so optimise for size instead --
# is wrong. The interpreter executes wasm instructions one at a time, so fewer
# and cheaper instructions turn almost directly into less work. Measured on a
# 7.5 MB PDF: opt-level 3 against "z" is 47% faster interpreted and 36% faster
# compiled, and costs 1.47 MB of module size.
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"     # no unwinding tables in the wasm
strip = true
