name: ci
on: [push, pull_request]

jobs:
  # The harness, against the Go-built stub. Runs under anydoc_nowasm so the
  # no-embed code path is exercised on every push.
  harness:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version: '1.22' }
      - name: Check formatting
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then echo "$unformatted"; exit 1; fi
      - name: Build stub module
        run: GOOS=wasip1 GOARCH=wasm go build -o testdata/stub.wasm ./internal/stub
      - run: go vet -tags anydoc_nowasm ./...
      - run: go test -race -tags anydoc_nowasm ./...

  # Real conversions against the committed anydoc.wasm. This is the suite that
  # catches the module and errors.go drifting apart.
  conversion:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version: '1.22' }
      - name: Verify the committed module matches its checksum
        run: sha256sum -c anydoc.wasm.sha256
      - run: go vet ./...
      - run: go test -race ./...

  cross:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version: '1.22' }
      # The point of this package: one wasm, every platform, no cgo. Built
      # without the nowasm tag, so the embedded module is part of what is
      # proven to cross-compile.
      - name: Cross-compile
        run: |
          for t in linux/amd64 linux/arm64 linux/riscv64 linux/ppc64le linux/386 \
                   darwin/amd64 darwin/arm64 windows/amd64 windows/arm64 freebsd/amd64; do
            GOOS=${t%/*} GOARCH=${t#*/} CGO_ENABLED=0 go build ./... || exit 1
            echo "ok $t"
          done
