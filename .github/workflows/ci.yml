name: ci
on: [push, pull_request]

jobs:
  # Runs exactly the task the maintainer runs locally before tagging, so CI
  # and the release checklist cannot drift apart: version consistency, the
  # stub harness suite, the committed module's checksum, formatting, vet under
  # both build tags, and the real conversion suite.
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version: '1.25' }
      - uses: arduino/setup-task@v2
        with:
          version: 3.x
          repo-token: ${{ secrets.GITHUB_TOKEN }}
      - run: task verify

  cross:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version: '1.25' }
      # The point of this package: one wasm, every platform, no cgo. Built
      # without the nowasm tag, so the embedded module is part of what is
      # proven to cross-compile.
      - name: Cross-compile
        run: |
          for t in linux/amd64 linux/arm64 linux/riscv64 linux/ppc64le linux/386 \
                   darwin/amd64 darwin/arm64 windows/amd64 windows/arm64 freebsd/amd64; do
            GOOS=${t%/*} GOARCH=${t#*/} CGO_ENABLED=0 go build ./... || exit 1
            echo "ok $t"
          done
